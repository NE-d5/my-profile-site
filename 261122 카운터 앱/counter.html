<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>카운터 앱</title>
  <!-- Tailwind CSS: 클래스 이름만 붙이면 스타일이 적용되는 도구 (인터넷 연결 필요) -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-100 flex items-center justify-center">

  <!-- 카드: 숫자와 버튼을 담는 하얀 상자 -->
  <main class="bg-white rounded-2xl shadow-lg p-10 text-center w-80">
    <h1 class="text-2xl font-bold text-slate-700 mb-6">카운터</h1>

    <!-- 현재 카운트 숫자. id로 JavaScript가 이 요소를 찾는다 -->
    <p id="count" class="text-7xl font-bold text-blue-600 mb-8" aria-live="polite">0</p>

    <!-- 버튼 3개: 감소 / 리셋 / 증가 -->
    <div class="flex gap-3 justify-center">
      <button id="decrease" class="w-16 h-12 rounded-lg bg-blue-500 text-white text-xl font-bold hover:bg-blue-600 active:scale-95 transition">-1</button>
      <button id="reset" class="w-20 h-12 rounded-lg bg-blue-100 text-blue-700 font-semibold hover:bg-blue-200 active:scale-95 transition">리셋</button>
      <button id="increase" class="w-16 h-12 rounded-lg bg-blue-500 text-white text-xl font-bold hover:bg-blue-600 active:scale-95 transition">+1</button>
    </div>
  </main>

  <script>
    // 현재 숫자를 기억하는 변수 (처음은 0)
    let count = 0;

    // 화면의 숫자 요소를 찾아둔다
    const countEl = document.getElementById('count');

    // 변수 값을 화면에 다시 그리는 함수
    function render() {
      countEl.textContent = count;
    }

    // 각 버튼을 클릭하면 숫자를 바꾸고 화면을 갱신한다
    document.getElementById('increase').addEventListener('click', () => { count++; render(); });
    document.getElementById('decrease').addEventListener('click', () => { count--; render(); });
    document.getElementById('reset').addEventListener('click', () => { count = 0; render(); });
  </script>
</body>
</html>
