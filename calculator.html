<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>계산기</title>
<style>
  /* 색상은 변수로 모아 한 곳에서 바꾼다 */
  :root { --bg:#f4f5f7; --card:#fff; --text:#222; --key:#eef0f4; --op:#4f46e5; --opText:#fff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#16171d; --card:#22242c; --text:#eee; --key:#33363f; --op:#818cf8; --opText:#16171d; }
  }
  * { box-sizing:border-box; }
  body { margin:0; padding:40px 16px; background:var(--bg); color:var(--text);
         font-family:"Pretendard","Malgun Gothic",sans-serif; }
  main { max-width:320px; margin:0 auto; background:var(--card); border-radius:16px;
         padding:16px; box-shadow:0 2px 12px rgba(0,0,0,.08); }
  #display { text-align:right; font-size:2.2rem; padding:16px 8px; min-height:72px;
             word-break:break-all; }
  .keys { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
  button { padding:16px 0; border:0; border-radius:10px; background:var(--key);
           color:inherit; font-size:1.2rem; cursor:pointer; }
  button.op { background:var(--op); color:var(--opText); }
  button.wide { grid-column:span 2; }
</style>
</head>
<body>
<main>
  <div id="display">0</div>
  <div class="keys" id="keys">
    <button data-act="clear" class="wide">AC</button>
    <button data-act="back">⌫</button>
    <button data-op="/" class="op">÷</button>
    <button data-num="7">7</button><button data-num="8">8</button><button data-num="9">9</button>
    <button data-op="*" class="op">×</button>
    <button data-num="4">4</button><button data-num="5">5</button><button data-num="6">6</button>
    <button data-op="-" class="op">−</button>
    <button data-num="1">1</button><button data-num="2">2</button><button data-num="3">3</button>
    <button data-op="+" class="op">+</button>
    <button data-num="0" class="wide">0</button>
    <button data-num=".">.</button>
    <button data-act="equal" class="op">=</button>
  </div>
</main>

<script>
  const display = document.getElementById('display');

  // 상태: 이전 값(prev), 선택한 연산자(op), 입력 중인 값(current, 문자열)
  let prev = null, op = null, current = '0', fresh = false;

  // a op b 를 계산해 숫자(또는 에러 문자열)를 돌려준다.
  // TODO(human): + - * / 계산을 구현하세요. 0으로 나누기 처리도 여기서 결정합니다.
  function calculate(a, b, op) {
    return b;
  }

  function show() { display.textContent = current; }

  // 연산자 누를 때: 앞서 입력한 연산이 있으면 먼저 계산해 이어간다 (1+2+3 처럼)
  function applyOp(next) {
    if (op && !fresh) {
      current = String(calculate(prev, parseFloat(current), op));
    }
    prev = parseFloat(current);
    op = next;
    fresh = true;
    show();
  }

  document.getElementById('keys').onclick = (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    const { num, op: o, act } = b.dataset;

    if (num !== undefined) {
      if (fresh || current === '0') { current = num === '.' ? '0.' : num; }
      else if (num !== '.' || !current.includes('.')) { current += num; }
      fresh = false;
    } else if (o) {
      applyOp(o);
      return;
    } else if (act === 'equal' && op) {
      current = String(calculate(prev, parseFloat(current), op));
      op = null; prev = null; fresh = true;
    } else if (act === 'clear') {
      prev = op = null; current = '0'; fresh = false;
    } else if (act === 'back') {
      current = current.length > 1 ? current.slice(0, -1) : '0';
    }
    show();
  };
</script>
</body>
</html>
