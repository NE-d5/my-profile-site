<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오늘의 운세</title>
<style>
  :root {
    --gold: #d4af37;
    --ink: #e8e4f5;
    --bg1: #1b1240;
    --bg2: #07040f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.5rem;
    padding: 2rem 16px;
    color: var(--ink);
    font-family: Georgia, "Noto Serif KR", "Batang", serif;
    background: radial-gradient(ellipse at 50% 20%, var(--bg1), var(--bg2) 70%) fixed;
    overflow-x: hidden;
  }
  /* 반짝이는 별 */
  .stars, .stars::before, .stars::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image:
      radial-gradient(1.5px 1.5px at 10% 20%, #fff, transparent),
      radial-gradient(1px 1px at 30% 70%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 55% 35%, #fff, transparent),
      radial-gradient(1px 1px at 75% 80%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 90% 15%, #fff, transparent),
      radial-gradient(1px 1px at 20% 90%, #fff, transparent),
      radial-gradient(1px 1px at 65% 10%, #fff, transparent);
    animation: twinkle 4s ease-in-out infinite alternate;
  }
  .stars::before { transform: translate(37px, 53px) scale(1.3); animation-delay: -1.5s; }
  .stars::after  { transform: translate(-61px, 29px) scale(0.8); animation-delay: -3s; }
  @keyframes twinkle { from { opacity: .25; } to { opacity: 1; } }

  h1 {
    margin: 0;
    font-weight: 400;
    letter-spacing: .3em;
    font-size: clamp(1.4rem, 5vw, 2rem);
    color: var(--gold);
    text-shadow: 0 0 18px rgba(212,175,55,.5);
  }

  /* 카드 */
  .card {
    width: min(240px, 60vw);
    aspect-ratio: 2 / 3;
    perspective: 1000px;
  }
  .inner {
    position: relative;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
    transition: transform .8s cubic-bezier(.2,.8,.2,1);
  }
  .card.flipped .inner { transform: rotateY(180deg); }
  .face {
    position: absolute;
    inset: 0;
    border: 2px solid var(--gold);
    border-radius: 14px;
    backface-visibility: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: .8rem;
    box-shadow: 0 0 30px rgba(212,175,55,.25), inset 0 0 40px rgba(0,0,0,.5);
  }
  .back {
    background:
      radial-gradient(circle at 50% 50%, rgba(212,175,55,.35) 0 2px, transparent 3px) 0 0 / 28px 28px,
      linear-gradient(160deg, #2a1a5e, #10082b);
    font-size: 4rem;
    color: var(--gold);
  }
  .front {
    transform: rotateY(180deg);
    background: linear-gradient(160deg, #1d1448, #0b0620);
    padding: 1rem;
    text-align: center;
  }
  .icon { font-size: clamp(3rem, 14vw, 4.5rem); filter: drop-shadow(0 0 12px var(--gold)); }
  .name { font-size: 1.3rem; color: var(--gold); letter-spacing: .15em; }

  #msg {
    min-height: 4.5em;
    max-width: 32ch;
    text-align: center;
    line-height: 1.7;
    font-size: 1.05rem;
    margin: 0;
  }

  button {
    font: inherit;
    letter-spacing: .2em;
    color: var(--gold);
    background: transparent;
    border: 1px solid var(--gold);
    border-radius: 999px;
    padding: .8rem 2.2rem;
    cursor: pointer;
    transition: background .2s, box-shadow .2s;
  }
  button:hover:not(:disabled), button:focus-visible {
    background: rgba(212,175,55,.15);
    box-shadow: 0 0 20px rgba(212,175,55,.5);
    outline: none;
  }
  button:disabled { opacity: .5; cursor: wait; }

  @media (prefers-reduced-motion: reduce) {
    .stars, .stars::before, .stars::after { animation: none; }
    .inner { transition: none; }
  }
</style>
</head>
<body>
<div class="stars" aria-hidden="true"></div>
<h1>오늘의 운세</h1>

<div class="card" id="card">
  <div class="inner">
    <div class="face back" aria-hidden="true">✦</div>
    <div class="face front">
      <div class="icon" id="icon"></div>
      <div class="name" id="name"></div>
    </div>
  </div>
</div>

<p id="msg" aria-live="polite">마음을 가라앉히고 카드를 뽑아보세요.</p>
<button id="draw">카드 뽑기</button>

<script>
  const CARDS = [
    { icon: "⭐", name: "별",     msg: "희망의 빛이 길을 밝힙니다. 오늘 품은 소원은 생각보다 가까이 와 있어요." },
    { icon: "🌙", name: "달",     msg: "직감이 예민한 날입니다. 서두르지 말고 마음의 속삭임에 귀 기울이세요." },
    { icon: "☀️", name: "태양",   msg: "활력이 넘치고 좋은 소식이 들려옵니다. 자신 있게 앞으로 나아가세요." },
    { icon: "🎡", name: "운명의 수레바퀴", msg: "흐름이 바뀌는 날입니다. 뜻밖의 기회가 찾아오니 열린 마음으로 맞이하세요." },
    { icon: "🦁", name: "힘",     msg: "부드러운 용기가 어려움을 이깁니다. 인내가 오늘의 가장 큰 무기예요." },
    { icon: "💞", name: "연인",   msg: "소중한 사람과의 인연이 깊어집니다. 진심을 표현하기 좋은 하루입니다." },
    { icon: "🪄", name: "마법사", msg: "필요한 모든 것이 이미 당신 손에 있습니다. 실행에 옮기면 현실이 됩니다." },
    { icon: "🌍", name: "세계",   msg: "하나의 매듭이 아름답게 마무리됩니다. 성취와 충만함이 함께하는 날이에요." },
  ];

  const $ = id => document.getElementById(id);
  const card = $("card"), btn = $("draw");

  btn.addEventListener("click", () => {
    btn.disabled = true;
    // 이미 뒤집힌 카드는 먼저 되돌린 뒤 새 카드로 교체
    const wait = card.classList.contains("flipped") ? 800 : 0;
    card.classList.remove("flipped");
    $("msg").textContent = "카드를 섞는 중…";
    setTimeout(() => {
      const c = CARDS[Math.floor(Math.random() * CARDS.length)];
      $("icon").textContent = c.icon;
      $("name").textContent = c.name;
      card.classList.add("flipped");
      setTimeout(() => {
        $("msg").textContent = c.msg;
        btn.textContent = "다시 뽑기";
        btn.disabled = false;
      }, 800);
    }, wait);
  });
</script>
</body>
</html>
