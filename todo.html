<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>투두 리스트</title>
<style>
  /* 색상은 변수로 모아 한 곳에서 바꾼다 */
  :root { --bg:#f4f5f7; --card:#fff; --text:#222; --muted:#999; --accent:#4f46e5; --line:#e5e7eb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#16171d; --card:#22242c; --text:#eee; --muted:#777; --accent:#818cf8; --line:#33363f; }
  }
  * { box-sizing:border-box; }
  body { margin:0; padding:40px 16px; background:var(--bg); color:var(--text);
         font-family:"Pretendard","Malgun Gothic",sans-serif; }
  main { max-width:480px; margin:0 auto; background:var(--card); border-radius:12px;
         padding:24px; box-shadow:0 2px 12px rgba(0,0,0,.08); }
  h1 { margin:0 0 16px; font-size:1.4rem; }
  form { display:flex; gap:8px; margin-bottom:16px; }
  input[type=text] { flex:1; padding:10px 12px; border:1px solid var(--line); border-radius:8px;
                     background:transparent; color:inherit; font-size:1rem; }
  button { padding:10px 14px; border:0; border-radius:8px; background:var(--accent);
           color:#fff; font-size:1rem; cursor:pointer; }
  ul { list-style:none; margin:0; padding:0; }
  li { display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); }
  li span { flex:1; word-break:break-all; }
  li.done span { text-decoration:line-through; color:var(--muted); }
  li button { background:transparent; color:var(--muted); padding:4px 8px; }
  li button:hover { color:#ef4444; }
  #count { margin-top:12px; color:var(--muted); font-size:.9rem; }
</style>
</head>
<body>
<main>
  <h1>할 일 목록</h1>
  <form id="form">
    <input type="text" id="input" placeholder="할 일을 입력하세요" autocomplete="off" required>
    <button type="submit">추가</button>
  </form>
  <ul id="list"></ul>
  <div id="count"></div>
</main>

<script>
  const form = document.getElementById('form');
  const input = document.getElementById('input');
  const list = document.getElementById('list');
  const count = document.getElementById('count');

  // 저장소가 막혀 있어도 앱이 죽지 않도록 try/catch로 감싼다
  let todos = [];
  try { todos = JSON.parse(localStorage.getItem('todos')) || []; } catch (e) {}

  function save() {
    try { localStorage.setItem('todos', JSON.stringify(todos)); } catch (e) {}
  }

  function render() {
    list.innerHTML = '';
    todos.forEach((t, i) => {
      const li = document.createElement('li');
      li.className = t.done ? 'done' : '';

      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = t.done;
      cb.onchange = () => { t.done = cb.checked; save(); render(); };

      // textContent 사용: 사용자 입력이 HTML로 해석되는 것(XSS)을 막는다
      const span = document.createElement('span');
      span.textContent = t.text;

      const del = document.createElement('button');
      del.textContent = '✕';
      del.setAttribute('aria-label', '삭제');
      del.onclick = () => { todos.splice(i, 1); save(); render(); };

      li.append(cb, span, del);
      list.append(li);
    });
    const left = todos.filter(t => !t.done).length;
    count.textContent = todos.length ? `남은 할 일 ${left}개 / 전체 ${todos.length}개` : '할 일이 없습니다.';
  }

  form.onsubmit = (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    todos.push({ text, done: false });
    input.value = '';
    save(); render();
  };

  render();
</script>
</body>
</html>
